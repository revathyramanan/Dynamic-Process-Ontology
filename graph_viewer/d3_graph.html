<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Process Ontology</title>
    <script src="https://d3js.org/d3.v6.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h2 {
            margin: 20px;
            font-size: 24px;
        }

        #graph-container {
            width: 100vw;
            height: 85vh;
            border: 1px solid #ddd;
            position: relative;
        }

        svg {
            width: 100%;
            height: 100%;
        }

        .node {
            stroke: #fff;
            stroke-width: 1.5px;
            cursor: pointer;
        }

        .link {
            stroke: #999;
            stroke-opacity: 0.6;
        }

        #node-info {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(255, 255, 255, 0.95);
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
            display: none;
            width: 250px;
            max-height: 400px;
            overflow-y: auto;
        }

        #node-info h3 {
            margin-top: 0;
            font-size: 18px;
            color: #333;
            border-bottom: 2px solid #007bff;
            padding-bottom: 5px;
        }

        #node-info table {
            width: 100%;
            border-collapse: collapse;
        }

        #node-info table td {
            padding: 5px;
            border-bottom: 1px solid #ddd;
            word-break: break-word;
        }

        #node-info table td:first-child {
            font-weight: bold;
            color: #555;
            width: 40%;
        }

        #close-info {
            position: absolute;
            top: 5px;
            right: 8px;
            background: none;
            border: none;
            font-size: 16px;
            cursor: pointer;
            color: red;
        }

    </style>
</head>
<body>

    <h2>Dynamic Process Ontology</h2>

    <div id="graph-container">
        <svg></svg>
        <div id="node-info">
            <button id="close-info" onclick="document.getElementById('node-info').style.display='none'">✖</button>
            <h3>Node Details</h3>
            <table id="node-properties"></table>
        </div>
    </div>

    <script>
        // Load JSON Data
        d3.json("d3_graph.json").then(function(graph) {
            const width = document.getElementById("graph-container").offsetWidth;
            const height = document.getElementById("graph-container").offsetHeight;
            
            const svg = d3.select("svg")
                          .attr("width", width)
                          .attr("height", height)
                          .call(d3.zoom().scaleExtent([0.5, 3]).on("zoom", (event) => {
                              svg.attr("transform", event.transform);
                          }))
                          .append("g");

            const simulation = d3.forceSimulation(graph.nodes)
                .force("link", d3.forceLink(graph.links).id(d => d.id).distance(100))
                .force("charge", d3.forceManyBody().strength(-300))
                .force("center", d3.forceCenter(width / 2, height / 2));

            const link = svg.append("g")
                .selectAll("line")
                .data(graph.links)
                .enter().append("line")
                .attr("class", "link")
                .attr("stroke-width", 2);

            const node = svg.append("g")
                .selectAll("circle")
                .data(graph.nodes)
                .enter().append("circle")
                .attr("class", "node")
                .attr("r", 10)
                .attr("fill", d => d.color)
                .call(d3.drag()
                    .on("start", dragstarted)
                    .on("drag", dragged)
                    .on("end", dragended));

            node.append("title")
                .text(d => `Type: ${d.type}\nID: ${d.id}`);

            simulation.on("tick", () => {
                link.attr("x1", d => d.source.x)
                    .attr("y1", d => d.source.y)
                    .attr("x2", d => d.target.x)
                    .attr("y2", d => d.target.y);

                node.attr("cx", d => d.x)
                    .attr("cy", d => d.y);
            });

            function dragstarted(event, d) {
                if (!event.active) simulation.alphaTarget(0.3).restart();
                d.fx = d.x;
                d.fy = d.y;
            }

            function dragged(event, d) {
                d.fx = event.x;
                d.fy = event.y;
            }

            function dragended(event, d) {
                if (!event.active) simulation.alphaTarget(0);
                d.fx = null;
                d.fy = null;
            }

            // Show formatted node info card on click
            node.on("click", function(event, d) {
                const infoBox = document.getElementById("node-info");
                const table = document.getElementById("node-properties");

                // Clear old properties
                table.innerHTML = "";

                // Add properties dynamically
                for (const key in d) {
                    if (key !== "x" && key !== "y" && key !== "vx" && key !== "vy" && key !== "index") {
                        const row = document.createElement("tr");

                        const keyCell = document.createElement("td");
                        keyCell.textContent = key;
                        row.appendChild(keyCell);

                        const valueCell = document.createElement("td");
                        valueCell.textContent = d[key];
                        row.appendChild(valueCell);

                        table.appendChild(row);
                    }
                }

                infoBox.style.display = "block";
            });

        }).catch(error => console.error("Error loading JSON:", error));

    </script>

</body>
</html>
