<!DOCTYPE html>
<html>
<head>
    <title>Interactive Graph with Cytoscape.js</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.21.0/cytoscape.min.js"></script>
    <style>
        #cy {
            width: 100%;
            height: 600px;
            border: 1px solid #ddd;
        }
    </style>
</head>
<body>
    <h2>Interactive Graph Visualization</h2>
    <div id="cy"></div>
    <script>
        // Load JSON graph data
        fetch("cytoscape_graph.json")
        .then(response => response.json())
        .then(data => {
            var cy = cytoscape({
                container: document.getElementById("cy"),
                elements: data,
                style: [
                    { selector: "node", style: { "background-color": "#4a90e2", "label": "data(id)" } },
                    { selector: "edge", style: { "width": 2, "line-color": "#ccc", "target-arrow-shape": "triangle" } }
                ],
                layout: { name: "cose" }
            });

            cy.on("tap", "node", function(evt) {
                var node = evt.target;
                alert("Node: " + node.id() + "\nProperties: " + JSON.stringify(node.data(), null, 2));
            });

            cy.on("tap", "edge", function(evt) {
                var edge = evt.target;
                alert("Edge from " + edge.data("source") + " to " + edge.data("target") + "\nProperties: " + JSON.stringify(edge.data(), null, 2));
            });
        });
    </script>
</body>
</html>
